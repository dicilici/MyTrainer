syntax="proto3";

package sender;

option go_package="train/sender";

service Training {
  rpc SendToTrain(SendMessage) returns(Response);//将训练配置发送给训练端并初始化训练任务
  rpc QueryTraining(Query) returns(QueryResponse);//查询训练端当前训练进度
  rpc CancelTraining(Cancel) returns(CancelResponse);//取消训练信号
}

message Response{
  bool IsOK=1;//状态是否正常
  string Errors=2;//错误信息
}

message SendMessage{
  SendDataset Dataset=1;//训练数据集信息
  SendTrainConfig TrainConfig=2;//训练配置
  string id=3;//训练任务id
  string RemoteLogUrl=4;//训练端上报状态用的 RemoteLog 服务地址
}

message SendDataset{
  string Input=1;//输入的数据类型，文本为txt，图片为image，文本图片混合为mix
  int32 Validation=2;//用于验证模型训练的数据占总训练数据的百分比，例如：该值为30%，也就是说从传输的总训练数据中抽取30%的数据用于验证训练效果
  int32 CategoriesNumber=3;//用于识别训练中，指明训练数据应该区分为多少类
}

message SendTrainConfig{
  int32 Epochs=1;//训练轮数
  float LearningRate=2;//学习率
  string LossFunction=3;//损失函数的名字
  bool EarlyStop=4;//是否采取早停策略
  int32 EarlyStopPatient=5;//早停耐心，例如：若该值为4，则意味着如果连续4轮训练损失都没有下降则停止训练
  string ModelSave=6;//模型的存储路径，注意，模型训练之后应该被存储会相同路径下
  string LogSave=7;//训练端日志文件名（仅允许文件名，不允许包含目录分隔符），为空或非法时使用默认 <任务id>.txt
  string TimeOut=8;//训练限时（d/h/m/s 组合，如 1h30m），从任务排到当前开始计时，覆盖接收数据+训练
}

message Query{}

message QueryResponse{
  bool Done=1;//是否已经完成训练
  int32 Epoch=2;//当前训练轮次，若已经训练完则填入训练结束的那个轮次
  repeated float loss=3;//每一轮次的通过损失函数计算出来的值
  bool idOK=4;//状态是否正常
  string Errors=5;//错误信息
}

message Cancel{}

message CancelResponse{
  bool isOK=1;//状态是否正常
  string Errors=2;//错误信息
}
