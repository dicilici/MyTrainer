syntax="proto3";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

package cmdClient;

option go_package="train/cmdClient";

service ManagerLink{
  rpc CheckManager(google.protobuf.Empty) returns(google.protobuf.Empty);
  rpc ApplyManager(ApplyMessage) returns(ApplyResponse);
  rpc TaskManager(TaskMessage) returns(TaskResponse);
  rpc CancelManager(CancelMessage) returns(CancelResponse);
  rpc Exit(ExitMessage) returns(ExitResponse);
  rpc DeleteTaskDb(DeleteMessage) returns(DeleteResponse);
  rpc ViewTaskDb(ViewMessage) returns(ViewResponse);
  rpc CheckNode(CheckNodeMessage) returns(CheckNodeResponse);
  rpc JoinNode(JoinNodeMessage) returns(JoinNodeResponse);
  rpc DeleteNode(DeleteNodeMessage) returns(DeleteNodeResponse);
}

message ApplyMessage{
  string path=1;
  string name=2;
}

message ApplyResponse{
  bool IsOK=1;
  string ErrorMsg=2;
}

message TaskMessage{
  bool All=1;
  string id=2;
  string name=3;
}

message TaskResponse{
  bool IsOK=1;
  string ErrorMsg=2;
  string msg=3;
}

message CancelMessage{
  bool All=1;
  string id=2;
  string name=3;
}

message CancelResponse{
  bool IsOK=1;
  string ErrorMsg=2;
}

message ExitMessage{
  string name=1;
}

message ExitResponse{
  bool IsOK=1;
  string ErrorMsg=2;
}

message ViewMessage{
  string key=1;
  google.protobuf.Timestamp time=2;
}

message ViewResponse{
  bool IsOK=1;
  string ErrorMsg=2;
  string msg=3;
}

message DeleteMessage{
  string key=1;
  google.protobuf.Timestamp time=2;
}

message DeleteResponse{
  bool IsOK=1;
  string ErrorMsg=2;
}

message CheckNodeMessage{
  string Id=1;//任务 id，为空表示所有任务
}

message CheckNodeResponse{
  bool IsOK=1;
  string ErrorMsg=2;
  repeated NodeMetrics Metrics=3;
}

message NodeMetrics{
  string Id=1;//该节点承载的所有任务 id（逗号分隔）
  string Node=2;//TRAIN / DATA
  float Cpu=3;
  float Memory=4;
  float Disk=5;
  float DiskIO=6;
  string Url=7;//节点地址
}

message JoinNodeMessage{
  string NodeType=1;//TRAIN / DATA
  repeated string Urls=2;
}

message JoinNodeResponse{
  bool IsOK=1;
  string ErrorMsg=2;
}

message DeleteNodeMessage{
  repeated string Urls=1;
}

message DeleteNodeResponse{
  bool IsOK=1;
  string ErrorMsg=2;
}


